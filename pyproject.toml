[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidapay-transfer-bot"
version = "1.0.0"
description = "GFH Telecom & VidaPay Professional Tools"
authors = [{name = "Abad Umair Channa", email = "abad@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.10.0",
    "pillow>=10.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/abaduchanna/vidapay-transfer-bot"
Repository = "https://github.com/abaduchanna/vidapay-transfer-bot.git"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
