name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - VidaPay_Transfer_Bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE from .spec
        shell: bash
        run: |
          pyinstaller "${{ matrix.app }}.spec"
          if [ ! -f "dist/${{ matrix.app }}.exe" ]; then
            echo "::error::Build failed - dist/${{ matrix.app }}.exe not found"
            exit 1
          fi
          ls -la dist/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.app }}
          path: dist/${{ matrix.app }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all EXEs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded EXEs
        id: list_artifacts
        run: |
          ls -la dist/
          {
            echo "files<<EOF"
            for f in dist/*.exe; do
              echo "- $(basename "$f")"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release with build number
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VidaPay Transfer Bot Build ${{ github.run_number }}
          body: |
            Automated build #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Built from commit ${{ github.sha }}.

            Artifacts:
            ${{ steps.list_artifacts.outputs.files }}
          files: dist/*.exe
          make_latest: true
