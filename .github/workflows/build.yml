name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install --upgrade pip pyinstaller
    - run: python -m pip install -r requirements.txt
    # Use bash (Git Bash on Windows runners) so *.spec is glob-expanded.
    # PowerShell passes the literal "*.spec" to pyinstaller, which then
    # tries to mkdir build\* and crashes with WinError 123.
    - run: for spec in *.spec; do pyinstaller "$spec"; done
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: exe
        path: dist/
